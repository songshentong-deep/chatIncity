[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Nginx反向代理
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
user=root

# 用户服务
[program:user-service]
command=/app/bin/user-service
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/user-service.err.log
stdout_logfile=/var/log/supervisor/user-service.out.log
user=appuser
environment=SERVER_PORT="8001",GIN_MODE="release"

# 聊天服务
[program:chat-service]
command=/app/bin/chat-service
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/chat-service.err.log
stdout_logfile=/var/log/supervisor/chat-service.out.log
user=appuser
environment=SERVER_PORT="8004",GIN_MODE="release"

