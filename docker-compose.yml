version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: social-app-postgres
    environment:
      POSTGRES_DB: social_app
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - social-app-network

  # MongoDB数据库
  mongodb:
    image: mongo:6.0
    container_name: social-app-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: social_app
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - social-app-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: social-app-redis
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - social-app-network

  # API网关 (Nginx)
  nginx:
    image: nginx:alpine
    container_name: social-app-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - user-service
      - auth-service
      - match-service
      - chat-service
    networks:
      - social-app-network

  # 用户服务
  user-service:
    build:
      context: ./backend
      dockerfile: docker/user-service.Dockerfile
    container_name: social-app-user-service
    environment:
      - SERVER_PORT=8001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=social_app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=password
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
    networks:
      - social-app-network
    restart: unless-stopped

  # 认证服务
  auth-service:
    build:
      context: ./backend
      dockerfile: docker/auth-service.Dockerfile
    container_name: social-app-auth-service
    environment:
      - SERVER_PORT=8002
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - JWT_SECRET=your-super-secret-jwt-key
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - redis
    networks:
      - social-app-network
    restart: unless-stopped

  # 匹配服务
  match-service:
    build:
      context: ./backend
      dockerfile: docker/match-service.Dockerfile
    container_name: social-app-match-service
    environment:
      - SERVER_PORT=8003
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "8003:8003"
    depends_on:
      - postgres
      - redis
    networks:
      - social-app-network
    restart: unless-stopped

  # 聊天服务
  chat-service:
    build:
      context: ./backend
      dockerfile: docker/chat-service.Dockerfile
    container_name: social-app-chat-service
    environment:
      - SERVER_PORT=8004
      - POSTGRES_HOST=postgres
      - MONGODB_URI=mongodb://admin:password@mongodb:27017
      - REDIS_HOST=redis
    ports:
      - "8004:8004"
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - social-app-network
    restart: unless-stopped

  # 内容服务
  content-service:
    build:
      context: ./backend
      dockerfile: docker/content-service.Dockerfile
    container_name: social-app-content-service
    environment:
      - SERVER_PORT=8005
      - POSTGRES_HOST=postgres
      - MONGODB_URI=mongodb://admin:password@mongodb:27017
      - REDIS_HOST=redis
    ports:
      - "8005:8005"
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - social-app-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  social-app-network:
    driver: bridge